name: release

# Push a tag like `v0.1.3` to cut a full release: per-OS binaries, per-platform VS Code
# extensions (with the engine bundled), and the wheel are built; a GitHub Release is created
# with them attached; and the wheel is published to PyPI.
# `workflow_dispatch` rebuilds everything for the CURRENT pyproject version and attaches it to
# that version's release WITHOUT touching PyPI — handy for backfilling assets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

  binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, vscode_target: linux-x64 }
          - { os: macos-latest, target: macos-arm64, vscode_target: darwin-arm64 }
          - { os: windows-latest, target: windows-x64, vscode_target: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Build single binary
        shell: bash
        working-directory: packaging
        run: uv run pyinstaller ladex.spec --distpath ../dist-bin --workpath ../build-bin --noconfirm

      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          BIN=dist-bin/ladex
          [ "${{ runner.os }}" = "Windows" ] && BIN=dist-bin/ladex.exe
          "$BIN" --version
          "$BIN" scan tests/fixtures/sample_repo
          "$BIN" scan tests/fixtures/iac

      - name: Package platform VS Code extension (engine bundled)
        shell: bash
        run: |
          V="${{ needs.meta.outputs.version }}"
          EXT=extensions/vscode
          mkdir -p "$EXT/bin"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist-bin/ladex.exe "$EXT/bin/ladex.exe"
          else
            cp dist-bin/ladex "$EXT/bin/ladex"
            chmod +x "$EXT/bin/ladex"
          fi
          cd "$EXT"
          npm ci
          npm version "$V" --no-git-tag-version --allow-same-version
          npx vsce package --target "${{ matrix.vscode_target }}" \
            -o "$GITHUB_WORKSPACE/ladex-$V-${{ matrix.vscode_target }}.vsix"

      - name: Name the raw binary asset
        id: rn
        shell: bash
        run: |
          V="${{ needs.meta.outputs.version }}"
          SRC=dist-bin/ladex
          OUT="ladex-$V-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then SRC=dist-bin/ladex.exe; OUT="$OUT.exe"; fi
          mv "$SRC" "$OUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.target }}
          path: ${{ steps.rn.outputs.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: vsix-${{ matrix.vscode_target }}
          path: ladex-*-${{ matrix.vscode_target }}.vsix
          if-no-files-found: error

  vsix-universal:
    # A target-less VSIX (no bundled engine) for platforms we don't ship a binary for
    # (e.g. Intel Mac, linux-arm64) — it uses a `ladex` on PATH. Marketplace serves this
    # only when no platform-specific build matches.
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Package universal extension
        shell: bash
        run: |
          V="${{ needs.meta.outputs.version }}"
          cd extensions/vscode
          npm ci
          npm version "$V" --no-git-tag-version --allow-same-version
          npx vsce package -o "$GITHUB_WORKSPACE/ladex-$V-universal.vsix"
      - uses: actions/upload-artifact@v5
        with:
          name: vsix-universal
          path: ladex-*-universal.vsix
          if-no-files-found: error

  wheel:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v5
        with:
          name: wheel
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [meta, binaries, vsix-universal, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect assets
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f \
            \( -name 'ladex-*' -o -name '*.whl' -o -name '*.tar.gz' -o -name '*.vsix' \) \
            -exec cp {} upload/ \;
          ls -la upload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Ladex v${{ needs.meta.outputs.version }}
          files: upload/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  pypi-publish:
    # Only publish to PyPI on a real tag push (never on manual dispatch / backfill).
    needs: [meta, wheel]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing (no token/secret needed)
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  marketplace-publish:
    # Publish every platform VSIX to the VS Code Marketplace on a real tag push only
    # (manual dispatch/backfill must not re-publish an existing version). Requires the
    # `VSCE_PAT` repo secret (Azure DevOps PAT, Marketplace: Manage, all orgs).
    needs: [meta, binaries, vsix-universal]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/download-artifact@v5
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
      - name: Publish VSIXes to the Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not set — skipping Marketplace publish." >&2
            exit 0
          fi
          mapfile -t FILES < <(find vsix -name '*.vsix' | sort)
          echo "Publishing ${#FILES[@]} package(s): ${FILES[*]}"
          npx --yes @vscode/vsce publish --packagePath "${FILES[@]}"
