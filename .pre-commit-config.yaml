repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^tests/fixtures/
      - id: ruff-format
        exclude: ^tests/fixtures/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pytest>=8.3, pydantic>=2.7, types-PyYAML>=6.0]
        args: [--strict]
        files: ^(src|tests)/
        exclude: ^tests/fixtures/
