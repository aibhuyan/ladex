[project]
name = "ladex"
version = "0.1.1"
description = "A bill of lading for AI — shift-left AI governance and ML-BOM generation for developers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aibhuyan", email = "bhuyanalimrans@gmail.com" }]
keywords = ["aibom", "ml-bom", "cyclonedx", "eu-ai-act", "ai-governance", "sbom"]

# Runtime deps grow per-step, honestly, as each layer lands:
#   Step 1: pyyaml, pydantic        Step 2: tree-sitter, tree-sitter-python
#   Step 3: typer/rich              Step 4: httpx, platformdirs
#   Step 5: opa (shell-out)         Step 6: cyclonedx-python-lib  ... etc.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "cyclonedx-python-lib>=8.0",
    "cryptography>=42.0",
    "pygls>=1.3",
    "python-hcl2>=4.3",
]

[project.optional-dependencies]
# Keyless signing via Sigstore (OIDC + Fulcio + Rekor). Opt-in: the default local Ed25519
# signer needs no network or identity. `pip install ladex[sigstore]` enables the backend.
sigstore = ["sigstore>=3.0"]

[project.urls]
Homepage = "https://ladex.dev"
Repository = "https://github.com/aibhuyan/ladex"

[project.scripts]
ladex = "ladex.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
    # BOM schema validation in tests (pulls in jsonschema). Dev-only: the runtime never
    # validates, it only emits.
    "cyclonedx-python-lib[json-validation]>=8.0",
    # Single-binary builds for CI and for bundling into the VS Code extension.
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ladex"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Detection fixtures deliberately contain broken / non-idiomatic code — never lint them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
exclude = ['tests/fixtures/']

# Third-party libs that aren't installed in the isolated pre-commit mypy sandbox. When the
# lib IS installed with types (local runs), mypy still uses its real types; this only
# silences the "missing stub" error in the sandbox, keeping that hook light.
[[tool.mypy.overrides]]
module = [
    "tree_sitter",
    "tree_sitter_python",
    "httpx",
    "platformdirs",
    "cryptography.*",
    "pygls.*",
    "lsprotocol.*",
    "hcl2",
    "hcl2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
