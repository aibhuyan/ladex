# Ladex taxonomy pack — hosted inference APIs (OpenAI, Anthropic).
# Rules classify code signals; obligations are decided later by the policy layer.
schema_version: 1
name: inference_apis
version: 0.1.0
rules:
  # --- OpenAI ---
  - id: openai.import
    name: OpenAI SDK import
    component_type: inference_api
    provider: OpenAI
    description: The application imports the OpenAI Python SDK.
    match: { kind: import, module: openai }
    tags: [hosted, closed-weights]
    references: ["https://platform.openai.com/docs/libraries"]

  - id: openai.client
    name: OpenAI client construction
    component_type: inference_api
    provider: OpenAI
    description: A synchronous OpenAI API client is constructed.
    match: { kind: call, target: openai.OpenAI }
    tags: [hosted, closed-weights]

  - id: openai.async-client
    name: Async OpenAI client construction
    component_type: inference_api
    provider: OpenAI
    description: An asynchronous OpenAI API client is constructed.
    match: { kind: call, target: openai.AsyncOpenAI }
    tags: [hosted, closed-weights]

  - id: openai.model-id
    name: OpenAI model identifier
    component_type: model
    provider: OpenAI
    description: A string literal names a known OpenAI model family.
    match: { kind: string, pattern: "^(gpt-4o|gpt-4|gpt-3\\.5|o1|o3)([.-].*)?$" }
    tags: [hosted, closed-weights]

  # --- Anthropic ---
  - id: anthropic.import
    name: Anthropic SDK import
    component_type: inference_api
    provider: Anthropic
    description: The application imports the Anthropic Python SDK.
    match: { kind: import, module: anthropic }
    tags: [hosted, closed-weights]
    references: ["https://docs.anthropic.com/en/api/client-sdks"]

  - id: anthropic.client
    name: Anthropic client construction
    component_type: inference_api
    provider: Anthropic
    description: A synchronous Anthropic API client is constructed.
    match: { kind: call, target: anthropic.Anthropic }
    tags: [hosted, closed-weights]

  - id: anthropic.async-client
    name: Async Anthropic client construction
    component_type: inference_api
    provider: Anthropic
    description: An asynchronous Anthropic API client is constructed.
    match: { kind: call, target: anthropic.AsyncAnthropic }
    tags: [hosted, closed-weights]

  - id: anthropic.model-id
    name: Anthropic model identifier
    component_type: model
    provider: Anthropic
    description: A string literal names a Claude model.
    match: { kind: string, pattern: "^claude-[a-z0-9.-]+$" }
    tags: [hosted, closed-weights]

  # --- Google Gemini (both SDKs) ---
  - id: google-gemini.import
    name: Google Generative AI SDK import
    component_type: inference_api
    provider: Google
    description: The application imports the google-generativeai SDK.
    match: { kind: import, module: google.generativeai }
    tags: [hosted, closed-weights]
    references: ["https://ai.google.dev/gemini-api/docs"]

  - id: google-gemini.model
    name: Gemini GenerativeModel construction
    component_type: inference_api
    provider: Google
    description: A Gemini model handle is constructed (legacy SDK).
    match: { kind: call, target: google.generativeai.GenerativeModel }
    tags: [hosted, closed-weights]

  - id: google-genai.import
    name: Google GenAI SDK import
    component_type: inference_api
    provider: Google
    description: The application imports the newer google-genai SDK (from google import genai).
    match: { kind: import, module: google, symbol: genai }
    tags: [hosted, closed-weights]

  - id: google-genai.client
    name: Google GenAI client construction
    component_type: inference_api
    provider: Google
    description: A google-genai client is constructed.
    match: { kind: call, target: google.genai.Client }
    tags: [hosted, closed-weights]

  - id: google.model-id
    name: Gemini model identifier
    component_type: model
    provider: Google
    description: A string literal names a Gemini model.
    match: { kind: string, pattern: "^gemini-[a-z0-9.-]+$" }
    tags: [hosted, closed-weights]

  # --- Cohere ---
  - id: cohere.import
    name: Cohere SDK import
    component_type: inference_api
    provider: Cohere
    description: The application imports the Cohere SDK.
    match: { kind: import, module: cohere }
    tags: [hosted, closed-weights]
    references: ["https://docs.cohere.com/"]

  - id: cohere.client
    name: Cohere client construction
    component_type: inference_api
    provider: Cohere
    description: A Cohere API client is constructed.
    match: { kind: call, target: cohere.Client }
    tags: [hosted, closed-weights]

  - id: cohere.client-v2
    name: Cohere v2 client construction
    component_type: inference_api
    provider: Cohere
    description: A Cohere v2 API client is constructed.
    match: { kind: call, target: cohere.ClientV2 }
    tags: [hosted, closed-weights]

  # --- Mistral ---
  - id: mistral.import
    name: Mistral SDK import
    component_type: inference_api
    provider: Mistral
    description: The application imports the Mistral SDK.
    match: { kind: import, module: mistralai }
    tags: [hosted, closed-weights]
    references: ["https://docs.mistral.ai/"]

  - id: mistral.client
    name: Mistral client construction
    component_type: inference_api
    provider: Mistral
    description: A Mistral API client is constructed.
    match: { kind: call, target: mistralai.Mistral }
    tags: [hosted, closed-weights]

  # --- litellm (multi-provider gateway) ---
  - id: litellm.import
    name: LiteLLM import
    component_type: inference_api
    provider: LiteLLM
    description: The application imports LiteLLM, a multi-provider LLM gateway.
    match: { kind: import, module: litellm }
    tags: [hosted, gateway]
    references: ["https://docs.litellm.ai/"]

  - id: litellm.completion
    name: LiteLLM completion call
    component_type: inference_api
    provider: LiteLLM
    description: A completion is requested through LiteLLM.
    match: { kind: call, target: litellm.completion }
    tags: [hosted, gateway]

  - id: litellm.acompletion
    name: LiteLLM async completion call
    component_type: inference_api
    provider: LiteLLM
    description: An async completion is requested through LiteLLM.
    match: { kind: call, target: litellm.acompletion }
    tags: [hosted, gateway]

  # --- Ollama (local inference) ---
  - id: ollama.import
    name: Ollama import
    component_type: inference_api
    provider: Ollama
    description: The application imports the Ollama client for local models.
    match: { kind: import, module: ollama }
    tags: [local, open-weights]
    references: ["https://github.com/ollama/ollama-python"]

  - id: ollama.chat
    name: Ollama chat call
    component_type: inference_api
    provider: Ollama
    description: A chat completion is requested from a local Ollama model.
    match: { kind: call, target: ollama.chat }
    tags: [local, open-weights]

  - id: ollama.client
    name: Ollama client construction
    component_type: inference_api
    provider: Ollama
    description: An Ollama client is constructed.
    match: { kind: call, target: ollama.Client }
    tags: [local, open-weights]
